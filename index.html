<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="电化学实验配液计算器">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ctext y=%2226%22 font-size=%2226%22%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
</head>
<body>
<title>配液台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens: light is the bare :root, dark redefined twice -------- */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface-2:#E9EFEE; --surface-3:#DFE8E6;
  --border:#D3DEDC; --border-strong:#B6C6C3;
  --ink:#0E1A19; --ink-2:#364946; --muted:#647976;
  --accent:#0B6A66; --accent-ink:#FFFFFF; --accent-soft:#D9EBE9; --accent-line:#8FC4C0;
  --warn:#8A5705; --warn-soft:#FBEFD9; --warn-line:#DEB871;
  --danger:#9C2F27; --danger-soft:#FAE6E3; --danger-line:#DFA49D;
  --shadow:0 1px 2px rgba(14,26,25,.06), 0 8px 24px -12px rgba(14,26,25,.18);
  --radius:10px; --radius-sm:7px;
  --sans:"Archivo","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Cascadia Mono",ui-monospace,"PingFang SC","Microsoft YaHei",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1312; --surface:#121C1B; --surface-2:#182422; --surface-3:#1F2D2B;
    --border:#263634; --border-strong:#38504D;
    --ink:#E4EDEB; --ink-2:#B5C6C3; --muted:#829996;
    --accent:#52BFB6; --accent-ink:#04201F; --accent-soft:#17312F; --accent-line:#2E605C;
    --warn:#E0A94E; --warn-soft:#2E2412; --warn-line:#5E4A20;
    --danger:#E8897E; --danger-soft:#301916; --danger-line:#5E312B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1312; --surface:#121C1B; --surface-2:#182422; --surface-3:#1F2D2B;
  --border:#263634; --border-strong:#38504D;
  --ink:#E4EDEB; --ink-2:#B5C6C3; --muted:#829996;
  --accent:#52BFB6; --accent-ink:#04201F; --accent-soft:#17312F; --accent-line:#2E605C;
  --warn:#E0A94E; --warn-soft:#2E2412; --warn-line:#5E4A20;
  --danger:#E8897E; --danger-soft:#301916; --danger-line:#5E312B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.01em}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- shell ------------------------------------------------------- */
.app{max-width:1180px; margin:0 auto; padding:0 16px 72px}

header.top{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:22px 0 16px; border-bottom:1px solid var(--border); margin-bottom:18px;
}
header.top h1{font-size:19px; letter-spacing:-.02em}
header.top .sub{color:var(--muted); font-size:13px; flex:1 1 220px}
.theme-btn{
  background:var(--surface); border:1px solid var(--border); color:var(--ink-2);
  border-radius:var(--radius-sm); padding:6px 11px; cursor:pointer;
  font-size:12.5px; font-family:var(--mono);
}
.theme-btn:hover{border-color:var(--border-strong); color:var(--ink)}

.layout{display:grid; grid-template-columns:186px minmax(0,1fr); gap:26px; align-items:start}
@media (max-width:860px){ .layout{grid-template-columns:minmax(0,1fr); gap:16px} }

/* ---------- module rail ------------------------------------------------- */
nav.rail{position:sticky; top:16px; display:flex; flex-direction:column; gap:3px}
.rail-group{
  font-size:10.5px; letter-spacing:.11em; 
  color:var(--muted); font-weight:600; padding:14px 8px 5px;
}
.rail-group:first-child{padding-top:2px}
.rail button{
  display:block; width:100%; text-align:left; cursor:pointer;
  background:none; border:0; border-radius:var(--radius-sm);
  padding:7px 10px; font-size:14px; color:var(--ink-2);
}
.rail button:hover{background:var(--surface-2); color:var(--ink)}
.rail button[aria-current="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}
@media (max-width:860px){
  nav.rail{
    position:sticky; top:0; z-index:20; flex-direction:row; gap:4px; overflow-x:auto;
    background:var(--bg); padding:8px 16px; margin:0 -16px;
    border-bottom:1px solid var(--border); scrollbar-width:none;
  }
  nav.rail::-webkit-scrollbar{display:none}
  .rail-group{display:none}
  .rail button{width:auto; white-space:nowrap; padding:7px 13px; border:1px solid var(--border); background:var(--surface)}
  .rail button[aria-current="true"]{border-color:var(--accent)}
}

/* ---------- panels ------------------------------------------------------ */
.panel{display:none}
.panel.on{display:block}
.panel-head{margin-bottom:16px}
.panel-head h2{font-size:17px}
.panel-head p{margin:5px 0 0; color:var(--muted); font-size:13.5px; max-width:66ch}

.cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,340px); gap:20px; align-items:start}
@media (max-width:980px){ .cols{grid-template-columns:minmax(0,1fr)} }

.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px;
}
.card + .card{margin-top:14px}
.card h3{
  font-size:11px; letter-spacing:.1em; 
  color:var(--muted); font-weight:600; margin-bottom:13px;
}

/* ---------- fields ------------------------------------------------------ */
.fields{display:flex; flex-direction:column; gap:12px}
.field{display:flex; flex-direction:column; gap:5px}
.field > .lab{font-size:13px; color:var(--ink-2); display:flex; gap:7px; align-items:baseline}
.field > .lab .sym{font-family:var(--mono); color:var(--accent); font-weight:500}
.inrow{display:flex; gap:0}
.inrow input{
  flex:1 1 auto; min-width:0; background:var(--surface); color:var(--ink);
  border:1px solid var(--border); border-right:0;
  border-radius:var(--radius-sm) 0 0 var(--radius-sm);
  padding:9px 11px; font-family:var(--mono); font-size:15px;
  font-variant-numeric:tabular-nums;
}
.inrow input.solo{border-right:1px solid var(--border); border-radius:var(--radius-sm)}
.inrow input:hover{border-color:var(--border-strong)}
.inrow input:focus{outline:none; border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.inrow select{
  flex:0 0 auto; background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--border); border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  padding:9px 8px; font-family:var(--mono); font-size:13.5px; cursor:pointer;
}
.inrow select:hover{color:var(--ink)}
.field.solved .inrow input{
  background:var(--accent-soft); border-color:var(--accent-line);
  color:var(--accent); font-weight:600; cursor:default;
}
.field.solved .inrow select{background:var(--accent-soft); border-color:var(--accent-line)}
.hint{font-size:12px; color:var(--muted)}
.hint code{font-family:var(--mono); font-size:11.5px}

/* iOS Safari zooms the whole page when a focused control is under 16px, and
   never zooms back out. Touch devices get 16px controls; pointer devices keep
   the denser 15px/13.5px sizing. */
@media (pointer:coarse){
  .inrow input, .inrow select, .drawer-search input, .drawer-search input[type="search"]{
    font-size:16px;
  }
  .inrow select{padding-inline:10px}
}

/* ---------- segmented solve-for selector -------------------------------- */
.seg{display:flex; gap:0; margin-bottom:14px; flex-wrap:wrap}
.seg .seg-lab{
  font-size:11px; letter-spacing:.1em;  color:var(--muted);
  font-weight:600; align-self:center; margin-right:10px;
}
.seg button{
  background:var(--surface-2); border:1px solid var(--border); border-right-width:0;
  padding:6px 13px; cursor:pointer; font-family:var(--mono); font-size:13px; color:var(--ink-2);
}
.seg button:first-of-type{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.seg button:last-of-type{border-radius:0 var(--radius-sm) var(--radius-sm) 0; border-right-width:1px}
.seg button:hover{background:var(--surface-3); color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}

/* ---------- result card ------------------------------------------------- */
.result{
  background:var(--surface); border:1px solid var(--border);
  border-top:2px solid var(--accent); border-radius:var(--radius);
  padding:16px; position:sticky; top:16px;
}
@media (max-width:980px){ .result{position:static} }
.result .cap{
  font-size:11px; letter-spacing:.1em; 
  color:var(--muted); font-weight:600;
}
.big{
  font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:-.02em;
  margin:8px 0 2px; color:var(--ink); line-height:1.15; overflow-wrap:anywhere;
  font-variant-numeric:tabular-nums;
}
.big .u{font-size:19px; color:var(--muted); font-weight:500; margin-left:3px}
.say{font-size:13.5px; color:var(--ink-2); margin-top:9px; line-height:1.55}
.say b{color:var(--accent); font-family:var(--mono); font-weight:600}

.work{
  margin-top:14px; padding-top:13px; border-top:1px solid var(--border);
  font-family:var(--mono); font-size:12.5px; color:var(--ink-2); line-height:1.75;
  overflow-x:auto;
}
.work .eq{color:var(--ink); font-weight:500}
.work .sb{color:var(--muted); display:block; white-space:nowrap}

.equiv{margin-top:13px; padding-top:12px; border-top:1px solid var(--border)}
.equiv table{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:12.5px}
.equiv td{padding:3px 0; font-variant-numeric:tabular-nums}
.equiv td:first-child{color:var(--muted); width:7.5em}
.equiv td:last-child{text-align:right; color:var(--ink-2)}

/* ---------- notes / warnings -------------------------------------------- */
.note{
  border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; line-height:1.55;
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2);
  margin-top:12px;
}
.note.warn{background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn)}
.note.danger{background:var(--danger-soft); border-color:var(--danger-line); color:var(--danger)}
.note.info{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
.note b{font-weight:600}
.note code{font-family:var(--mono); font-size:12px}
.note + .note{margin-top:8px}

/* ---------- tables ------------------------------------------------------ */
.tablewrap{overflow-x:auto; margin-top:4px}
table.data{width:100%; border-collapse:collapse; font-size:13px}
table.data th{
  text-align:left; font-size:10.5px; letter-spacing:.08em; 
  color:var(--muted); font-weight:600; padding:0 10px 7px 0; white-space:nowrap;
  border-bottom:1px solid var(--border);
}
table.data td{
  padding:8px 10px 8px 0; border-bottom:1px solid var(--border);
  font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap;
}
table.data td:first-child{color:var(--muted)}
table.data tr:last-child td{border-bottom:0}
table.data tr.flag td{color:var(--warn)}
table.data tr.blankrow td{color:var(--muted)}
table.data .em{color:var(--accent); font-weight:600}

/* ---------- reagent drawer ---------------------------------------------- */
.lib-btn{
  background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2);
  border-radius:var(--radius-sm); padding:5px 10px; cursor:pointer; font-size:12.5px;
}
.lib-btn:hover{border-color:var(--accent); color:var(--accent)}
.scrim{
  position:fixed; inset:0; background:rgba(8,16,15,.42); z-index:40;
  display:none;
}
.scrim.on{display:block}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(420px,92vw); z-index:41;
  background:var(--surface); border-left:1px solid var(--border);
  display:none; flex-direction:column; box-shadow:var(--shadow);
}
.drawer.on{display:flex}
.drawer-head{padding:16px 16px 12px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center}
.drawer-head h3{font-size:14px; flex:1; text-transform:none; letter-spacing:0; color:var(--ink); margin:0}
.drawer-head button{background:none; border:0; cursor:pointer; color:var(--muted); font-size:22px; line-height:1; padding:2px 6px}
.drawer-head button:hover{color:var(--ink)}
.drawer-search{padding:12px 16px; border-bottom:1px solid var(--border)}
.drawer-search input{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
  border-radius:var(--radius-sm); padding:9px 11px; font-size:14px;
}
.drawer-search input:focus{outline:none; border-color:var(--accent)}
.drawer-list{overflow-y:auto; flex:1; padding:6px 0}
.lib-group{
  font-size:10.5px; letter-spacing:.1em;  color:var(--muted);
  font-weight:600; padding:14px 16px 6px;
}
.lib-item{
  display:block; width:100%; text-align:left; background:none; border:0; cursor:pointer;
  padding:9px 16px; border-bottom:1px solid var(--border);
}
.lib-item:hover{background:var(--surface-2)}
.lib-item .nm{font-size:13.5px; color:var(--ink)}
.lib-item .fm{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:10px; flex-wrap:wrap}
.lib-item .fm .mw{color:var(--accent)}
.lib-item .no{font-size:12px; color:var(--warn); margin-top:3px}



/* ---------- natural-language input -------------------------------------- */
.ask-input{
  width:100%; background:var(--surface); color:var(--ink);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:12px 13px; font-family:var(--sans); font-size:16px; line-height:1.6;
  resize:vertical; min-height:76px;
}
.ask-input::placeholder{color:var(--muted)}
.ask-input:hover{border-color:var(--border-strong)}
.ask-input:focus{outline:none; border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.echo{display:flex; flex-direction:column; gap:6px}
.echo-row{display:flex; gap:10px; align-items:baseline; font-size:13px}
.echo-k{flex:0 0 5.5em; color:var(--muted); font-size:12px}
.echo-v{flex:1; font-family:var(--mono); color:var(--accent); font-size:13px;
  overflow-wrap:anywhere}
@media (max-width:600px){
  /* narrow screens: stack label over value so neither has to wrap mid-word */
  .echo-row{flex-direction:column; gap:1px}
  .echo-k{flex:none}
  .chiprow .chip{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
}

/* ---------- records ----------------------------------------------------- */
.card-head{display:flex; align-items:center; gap:10px; margin-bottom:13px}
.card-head h3{margin:0; flex:1}
.rec-row{margin-top:14px; padding-top:13px; border-top:1px solid var(--border);
  display:flex; justify-content:flex-end}
.rec-btn{font-family:var(--mono)}
.rec-btn.bad{border-color:var(--danger); color:var(--danger)}
.rail button .badge{
  display:inline-block; margin-left:7px; min-width:19px; padding:0 5px;
  border-radius:100px; background:var(--accent); color:var(--accent-ink);
  font-family:var(--mono); font-size:11px; line-height:17px; text-align:center;
  font-weight:600; vertical-align:middle;
}
.rail button[aria-current="true"] .badge{background:var(--accent-ink); color:var(--accent)}
.rec-item{border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px;
  overflow:hidden}
.rec-item:last-child{margin-bottom:0}
.rec-item-head{display:flex; align-items:center; gap:10px; padding:9px 12px;
  background:var(--surface-2); border-bottom:1px solid var(--border)}
.rec-n{font-family:var(--mono); font-size:12px; color:var(--accent-ink);
  background:var(--accent); border-radius:100px; min-width:20px; height:20px;
  line-height:20px; text-align:center; font-weight:600}
.rec-mod{flex:1; font-size:13.5px; color:var(--ink); font-weight:500}
.rec-t{font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap}
.rec-body, .rec-pre{
  margin:0; padding:12px; font-family:var(--mono); font-size:12px; line-height:1.6;
  color:var(--ink-2); white-space:pre; overflow-x:auto; background:var(--surface);
  tab-size:4;
}
.rec-pre{border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--surface-2); max-height:420px; overflow-y:auto}
@media (max-width:600px){
  .rec-item-head{flex-wrap:wrap}
  .rec-mod{flex:1 1 100%; order:3}
}

/* ---------- misc -------------------------------------------------------- */
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.row > *{flex:1 1 130px; min-width:0}
.row > .shrink{flex:0 0 auto}
.chiprow{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
.chip{
  background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2);
  border-radius:100px; padding:4px 11px; cursor:pointer; font-size:12.5px; font-family:var(--mono);
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.err{color:var(--danger); font-size:13.5px; line-height:1.55}
.mono{font-family:var(--mono)}
.tiny{font-size:12px; color:var(--muted); line-height:1.6}
.breakdown{font-family:var(--mono); font-size:12.5px; width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.breakdown td{padding:3px 0; border-bottom:1px solid var(--border)}
.breakdown td:nth-child(2),.breakdown td:nth-child(3){text-align:right; color:var(--ink-2)}
.breakdown td:last-child{text-align:right; color:var(--muted); width:5em}
label.check{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink-2); cursor:pointer}
label.check input{accent-color:var(--accent); width:16px; height:16px; cursor:pointer}
footer.foot{
  margin-top:34px; padding-top:16px; border-top:1px solid var(--border);
  color:var(--muted); font-size:12px; line-height:1.7;
}
</style>

<div class="app">
  <header class="top">
    <h1>配液台</h1>
    <span class="sub">电化学实验溶液配制 · 稀释 · 单位换算</span>
    <button class="theme-btn" id="themeBtn" type="button">主题</button>
  </header>

  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main id="main"></main>
  </div>

  <footer class="foot">
    摩尔质量按 IUPAC 2021 标准原子量计算。缓冲液配比为理论值，已按 Davies 式做活度校正，
    但残余误差仍有 ±0.1–0.2 pH —— <b>配好必须用 pH 计实测，并用 HCl / NaOH 微调</b>。
    浓酸稀释一律酸入水。
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="试剂库">
  <div class="drawer-head">
    <h3>试剂库</h3>
    <button type="button" id="drawerClose" aria-label="关闭">&times;</button>
  </div>
  <div class="drawer-search">
    <input type="search" id="libSearch" placeholder="搜名称、化学式或缩写…" autocomplete="off">
  </div>
  <div class="drawer-list" id="libList"></div>
</aside>

<script>

/* ============================================================================
   CORE — pure calculation layer for the electrochemistry solution calculator.
   No DOM access. Tested headlessly under node (see test.mjs), then inlined
   verbatim into the single-file HTML artifact.
   ========================================================================== */
const CORE = (() => {
"use strict";

/* ---------- 1. atomic weights --------------------------------------------
   IUPAC 2021 standard atomic weights; conventional values for the elements
   given as intervals, and the longest-lived-isotope mass number for those
   with no stable nuclide.                                                   */
const ATOMIC = {
  H:1.008, He:4.002602, Li:6.94, Be:9.0121831, B:10.81, C:12.011, N:14.007,
  O:15.999, F:18.998403162, Ne:20.1797, Na:22.98976928, Mg:24.305,
  Al:26.9815384, Si:28.085, P:30.973761998, S:32.06, Cl:35.45, Ar:39.95,
  K:39.0983, Ca:40.078, Sc:44.955907, Ti:47.867, V:50.9415, Cr:51.9961,

const SUBSCRIPTS = "₀₁₂₃₄₅₆₇₈₉";

/* ---------- 2. formula parser --------------------------------------------
   Handles nested ()/[]/{}, unicode subscripts, leading stoichiometric
   coefficients, and hydrate dots (·, *, •, and a bare "." when it is clearly
   a hydrate separator rather than a decimal point).                         */
function parseFormula(raw) {
  if (typeof raw !== "string") throw new Error("请输入化学式");
  let s = raw.trim();
  if (!s) throw new Error("请输入化学式");

  s = s.replace(/\s+/g, "")
       .replace(/[₀-₉]/g, d => String(SUBSCRIPTS.indexOf(d)))
       .replace(/[•·・．。*xX×]/g, c =>
          (c === "x" || c === "X") ? "x" : "·")
       // a bare "." only separates a hydrate when digits+uppercase follow
       .replace(/\.(?=\d*[A-Z])/g, "·")
       // "CuSO4x5H2O" style written with a literal x
       .replace(/x(?=\d*H2O)/g, "·");

  const parts = s.split("·").filter(p => p !== "");
  if (!parts.length) throw new Error("请输入化学式");

  const counts = {};
  for (const part of parts) {
    const m = /^(\d+(?:\.\d+)?)?([\s\S]*)$/.exec(part);
    const coef = m[1] ? parseFloat(m[1]) : 1;
    const body = m[2];
    if (!body) throw new Error("化学式不完整：" + part);
    const sub = parseGroup(body);
    for (const k in sub) counts[k] = (counts[k] || 0) + sub[k] * coef;
  }
  return counts;
}

function parseGroup(str) {
  let i = 0;
  const OPEN = { "(": ")", "[": "]", "{": "}" };
  const CLOSE = { ")": 1, "]": 1, "}": 1 };

  function readNumber() {
    const m = /^\d+(?:\.\d+)?/.exec(str.slice(i));
    if (!m) return 1;
    i += m[0].length;
    return parseFloat(m[0]);
  }

  function atoms(expectClose) {
    const res = {};
    while (i < str.length) {
      const ch = str[i];
      if (OPEN[ch]) {
        const close = OPEN[ch];
        i++;
        const inner = atoms(close);
        if (str[i] !== close) throw new Error("括号不匹配，缺少 " + close);
        i++;
        const n = readNumber();
        for (const k in inner) res[k] = (res[k] || 0) + inner[k] * n;
      } else if (CLOSE[ch]) {
        if (expectClose) return res;
        throw new Error("多余的右括号 " + ch);
      } else if (/[A-Z]/.test(ch)) {
        let sym = (/^[A-Z][a-z]{0,2}/.exec(str.slice(i)) || [""])[0];
        while (sym.length > 1 && !(sym in ATOMIC)) sym = sym.slice(0, -1);
        if (!(sym in ATOMIC)) throw new Error("未知元素：" + str.slice(i, i + 2));
        i += sym.length;
        const n = readNumber();
        res[sym] = (res[sym] || 0) + n;
      } else {
        throw new Error("无法识别的字符：" + ch);
      }
    }
    if (expectClose) throw new Error("括号不匹配，缺少 " + expectClose);
    return res;
  }

  const out = atoms(null);
  if (!Object.keys(out).length) throw new Error("化学式为空");
  return out;
}

/** Molar mass in g/mol, plus the per-element breakdown used by the UI. */
function molarMass(formula) {
  const counts = parseFormula(formula);
  let total = 0;
  const rows = [];
  for (const el in counts) {
    const sub = ATOMIC[el] * counts[el];
    total += sub;
    rows.push({ element: el, count: counts[el], atomic: ATOMIC[el], subtotal: sub });
  }
  rows.sort((a, b) => b.subtotal - a.subtotal);
  rows.forEach(r => { r.percent = total > 0 ? (r.subtotal / total) * 100 : 0; });
  return { mass: total, rows, counts };
}

/* ---------- 3. units ------------------------------------------------------
   Everything is stored internally in SI-ish base units:
     mass g · volume L · concentration mol/L · amount mol · area cm²         */
const U = "µ";                       // micro sign
const DIMS = {
  mass:     { base: "g",     units: [["ng",1e-9],[U+"g",1e-6],["mg",1e-3],["g",1],["kg",1e3]] },
  volume:   { base: "L",     units: [["nL",1e-9],[U+"L",1e-6],["mL",1e-3],["L",1]] },
  conc:     { base: "mol/L", units: [["nM",1e-9],[U+"M",1e-6],["mM",1e-3],["M",1]] },
  amount:   { base: "mol",   units: [["nmol",1e-9],[U+"mol",1e-6],["mmol",1e-3],["mol",1]] },
  molar:    { base: "g/mol", units: [["g/mol",1],["kg/mol",1e3]] },
  massconc: { base: "g/L",   units: [[U+"g/L",1e-6],["mg/L",1e-3],["ppm",1e-3],[U+"g/mL",1e-3],["mg/mL",1],["g/L",1],["%(w/v)",10]] },
  area:     { base: "cm²", units: [[U+"m²",1e-8],["mm²",1e-2],["cm²",1],["m²",1e4]] },
  length:   { base: "cm",    units: [[U+"m",1e-4],["mm",0.1],["cm",1],["m",100]] },
  current:  { base: "A",     units: [["pA",1e-12],["nA",1e-9],[U+"A",1e-6],["mA",1e-3],["A",1]] },
  charge:   { base: "C",     units: [["nC",1e-9],[U+"C",1e-6],["mC",1e-3],["C",1]] },
  rate:     { base: "V/s",   units: [["mV/s",1e-3],["V/s",1]] },
  time:     { base: "s",     units: [["ms",1e-3],["s",1],["min",60],["h",3600]] },
  density:  { base: "g/mL",  units: [["g/mL",1],["kg/m³",1e-3],["g/cm³",1]] },
  diff:     { base: "cm²/s", units: [["cm²/s",1],["m²/s",1e4]] },
  surfconc: { base: "mol/cm²", units: [["fmol/cm²",1e-15],["pmol/cm²",1e-12],["nmol/cm²",1e-9],[U+"mol/cm²",1e-6],["mol/cm²",1]] }
};

function factorOf(dim, unit) {
  const d = DIMS[dim];
  if (!d) throw new Error("未知量纲 " + dim);
  const hit = d.units.find(u => u[0] === unit);
  if (!hit) throw new Error("未知单位 " + unit + "（" + dim + "）");
  return hit[1];
}
/** value in `unit` → base unit */
const toBase = (v, dim, unit) => v * factorOf(dim, unit);
/** base-unit value → `unit` */
const fromBase = (v, dim, unit) => v / factorOf(dim, unit);

/** The list entry with factor 1 — the canonical selectable unit for a dim.
    Distinct from DIMS[dim].base, which is only a display label and may not
    appear in the list at all (conc's base is "mol/L", its list has "M"). */
function baseUnitName(dim) {
  const list = DIMS[dim].units;
  const one = list.find(u => u[1] === 1);
  return one ? one[0] : list[list.length - 1][0];
}

/** Pick the unit that puts the magnitude in a readable range (≥1 preferred). */
function pickUnit(baseValue, dim) {
  const list = DIMS[dim].units
    .filter(u => !/ppm|%|\(/.test(u[0]))          // skip aliases when auto-picking
    .slice().sort((a, b) => b[1] - a[1]);
  const av = Math.abs(baseValue);
  if (!isFinite(av) || av === 0) return baseUnitName(dim);
  for (const [name, f] of list) if (av / f >= 1) return name;
  return list[list.length - 1][0];
}

/* ---------- 4. number formatting ----------------------------------------- */
const SUPER = { "-":"⁻", "0":"⁰", "1":"¹", "2":"²", "3":"³",
  "4":"⁴", "5":"⁵", "6":"⁶", "7":"⁷", "8":"⁸", "9":"⁹" };

/** Round to `sig` significant figures and render without exponent noise. */
function sig(x, n = 4) {
  if (!isFinite(x)) return "—";
  if (x === 0) return "0";
  const av = Math.abs(x);
  if (av >= 1e6 || av < 1e-4) {
    const exp = Math.floor(Math.log10(av));
    const mant = x / Math.pow(10, exp);
    const e = String(exp).split("").map(c => SUPER[c] || c).join("");
    return trimZeros(mant.toPrecision(n)) + "×10" + e;
  }
  const digits = Math.max(0, n - 1 - Math.floor(Math.log10(av)));
  return trimZeros(x.toFixed(Math.min(digits, 12)));
}
function trimZeros(s) {
  if (s.indexOf(".") < 0) return s;
  return s.replace(/\.?0+$/, "");
}
/** "34.04 µL" — auto unit, for the headline result. */
function auto(baseValue, dim, n = 4) {
  const unit = pickUnit(baseValue, dim);
  return { value: fromBase(baseValue, dim, unit), unit, text: sig(fromBase(baseValue, dim, unit), n) + " " + unit };
}
/** Every equivalent unit, for the strip under the headline. */
function allUnits(baseValue, dim, n = 4) {
  return DIMS[dim].units.map(([name, f]) => ({ unit: name, text: sig(baseValue / f, n) }));
}

/* ---------- 5. solvers ----------------------------------------------------
   Each returns { value (base units), dim, expr } where expr is the formula
   with the user's own numbers substituted — the auditable "worked line".    */
function need(obj, keys) {
  for (const k of keys) {
    if (obj[k] === null || obj[k] === undefined || !isFinite(obj[k]))
      throw new Error("请填写 " + k);
    if (obj[k] < 0) throw new Error(k + " 不能为负");
  }
}
function nonZero(obj, keys) {
  for (const k of keys) if (obj[k] === 0) throw new Error(k + " 不能为 0");
}

/** C₁V₁ = C₂V₂ — solve for whichever of the four is unknown. */
function dilution(p, unknown) {
  const { C1, V1, C2, V2 } = p;
  switch (unknown) {
    case "C2": need(p, ["C1","V1","V2"]); nonZero(p, ["V2"]);
      return { value: C1*V1/V2, dim: "conc",
               expr: `C₂ = C₁V₁ / V₂` };
    case "V2": need(p, ["C1","V1","C2"]); nonZero(p, ["C2"]);
      return { value: C1*V1/C2, dim: "volume",
               expr: `V₂ = C₁V₁ / C₂` };
    case "C1": need(p, ["C2","V2","V1"]); nonZero(p, ["V1"]);
      return { value: C2*V2/V1, dim: "conc",
               expr: `C₁ = C₂V₂ / V₁` };
    case "V1": need(p, ["C2","V2","C1"]); nonZero(p, ["C1"]);
      return { value: C2*V2/C1, dim: "volume",
               expr: `V₁ = C₂V₂ / C₁` };
    default: throw new Error("未知求解目标 " + unknown);
  }
}

/** m = M·C·V — solve for whichever of the four is unknown. */
function prep(p, unknown) {
  const { M, C, V, m } = p;
  switch (unknown) {
    case "m": need(p, ["M","C","V"]);
      return { value: M*C*V, dim: "mass", expr: "m = M · C · V" };
    case "C": need(p, ["M","V","m"]); nonZero(p, ["M","V"]);
      return { value: m/(M*V), dim: "conc", expr: "C = m / (M · V)" };
    case "V": need(p, ["M","C","m"]); nonZero(p, ["M","C"]);
      return { value: m/(M*C), dim: "volume", expr: "V = m / (M · C)" };
    case "M": need(p, ["C","V","m"]); nonZero(p, ["C","V"]);
      return { value: m/(C*V), dim: "molar", expr: "M = m / (C · V)" };
    default: throw new Error("未知求解目标 " + unknown);
  }
}

/** n = m / M */
function moles(p, unknown) {
  const { m, M, n } = p;
  switch (unknown) {
    case "n": need(p, ["m","M"]); nonZero(p, ["M"]);
      return { value: m/M, dim: "amount", expr: "n = m / M" };
    case "m": need(p, ["n","M"]);
      return { value: n*M, dim: "mass", expr: "m = n · M" };
    case "M": need(p, ["m","n"]); nonZero(p, ["n"]);
      return { value: m/n, dim: "molar", expr: "M = m / n" };
    default: throw new Error("未知求解目标 " + unknown);
  }
}

/** Neat concentration of a liquid reagent: C = 1000·ρ·w / M  (ρ g/mL, w frac) */
function stockFromLiquid({ rho, w, M }) {
  need({ rho, w, M }, ["rho","w","M"]); nonZero({ M }, ["M"]);
  if (w > 1) throw new Error("质量分数请填 0–100 %");
  return { value: 1000*rho*w/M, dim: "conc",
           expr: "C = 1000 · ρ · w% / M" };
}

/** Weigh-back: you weighed m_actual instead of the target. */
function weighBack({ M, m_actual, V_target, C_target }) {
  need({ M, m_actual }, ["M","m_actual"]); nonZero({ M }, ["M"]);
  const out = {};
  if (isFinite(V_target) && V_target > 0) {
    out.C_actual = m_actual/(M*V_target);
    if (isFinite(C_target) && C_target > 0) {
      out.deviation = (out.C_actual - C_target)/C_target*100;
      out.m_target  = M*C_target*V_target;
    }
  }
  if (isFinite(C_target) && C_target > 0) out.V_needed = m_actual/(M*C_target);
  return out;
}

/** Balance readability: absolute error d on a mass m. */
function weighError(m_base_g, d_mg) {
  const d = d_mg*1e-3;
  if (!(m_base_g > 0)) return null;
  return { relative: d/m_base_g*100, d_mg };
}

/** Serial / direct dilution ladder for a calibration series. */
function ladder({ Cstock, targets, Vfinal, mode }) {
  if (!(Cstock > 0)) throw new Error("母液浓度必须大于 0");
  if (!(Vfinal > 0)) throw new Error("每点终体积必须大于 0");
  // a 0 point is a legitimate calibration blank — keep it, but it is pure
  // diluent and never a link in a serial chain, so it always sorts last
  const all = targets.filter(t => isFinite(t) && t >= 0).slice().sort((a,b) => b-a);
  if (!all.length) throw new Error("请至少填一个目标浓度");
  const list = all.filter(t => t > 0);
  const hasBlank = all.length > list.length;
  if (list.length && list[0] > Cstock)
    throw new Error("最高目标浓度 (" + sig(list[0]*1000) + " mM) 超过母液浓度 ("
                    + sig(Cstock*1000) + " mM)");

  const rows = [];
  if (mode === "serial") {
    let from = Cstock, fromLabel = "母液";
    for (let i = 0; i < list.length; i++) {
      const Ci = list[i];
      const Vtransfer = Ci*Vfinal/from;
      rows.push({ index: i+1, target: Ci, from: fromLabel, fromC: from,
                  Vtransfer, Vdiluent: Vfinal - Vtransfer, Vtotal: Vfinal,
                  fold: from/Ci });
      from = Ci; fromLabel = "第 " + (i+1) + " 级";
    }
    // each intermediate must hold its own final volume *plus* whatever the
    // next stage draws off it
    for (let i = 0; i < rows.length-1; i++) rows[i].Vneeded = Vfinal + rows[i+1].Vtransfer;
    if (rows.length) rows[rows.length-1].Vneeded = Vfinal;
  } else {
    for (let i = 0; i < list.length; i++) {
      const Ci = list[i];
      const Vtransfer = Ci*Vfinal/Cstock;
      rows.push({ index: i+1, target: Ci, from: "母液", fromC: Cstock,
                  Vtransfer, Vdiluent: Vfinal - Vtransfer, Vtotal: Vfinal,
                  Vneeded: Vfinal, fold: Cstock/Ci });
    }
  }
  if (hasBlank)
    rows.push({ index: rows.length+1, target: 0, from: "—", fromC: 0, blank: true,
                Vtransfer: 0, Vdiluent: Vfinal, Vtotal: Vfinal, Vneeded: Vfinal, fold: Infinity });
  return rows;
}

/** Equally spaced / log spaced target series. 0 is allowed as a linear blank. */
function series({ lo, hi, n, kind }) {
  if (!(n >= 2)) throw new Error("点数至少 2");
  if (!(hi > 0)) throw new Error("最高浓度必须大于 0");
  if (kind === "log" && !(lo > 0)) throw new Error("等比序列的最低浓度必须大于 0（0 点请用等差）");
  if (!(lo >= 0)) throw new Error("浓度不能为负");
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i/(n-1);
    out.push(kind === "log" ? lo*Math.pow(hi/lo, t) : lo + (hi-lo)*t);
  }
  return out;
}

   apparent Ka' is the self-consistent combination.                          */

  if (!z) return 0;                       // neutral species: γ ≈ 1
  const r = Math.sqrt(I);
  return -DAVIES_A * z * z * (r/(1+r) - 0.3*I);

/** Species distribution at a given pH for one buffer system. */
function speciate(sys, pH, I, T) {
  const H = Math.pow(10, -pH);
  const pKa = sys.pKa.map((p, k) =>
    p + (sys.dpKadT[k] || 0) * (T - 25));
  // activity-corrected: pKa'_k = pKa_k + log γ(z_k) − log γ(z_{k−1})
  const pKaApp = pKa.map((p, k) => {
    const zBefore = sys.zmax - k;         // species with k protons removed
    const zAfter  = sys.zmax - (k + 1);
    return p + logGamma(zAfter, I) - logGamma(zBefore, I);
  });
  const Ka = pKaApp.map(p => Math.pow(10, -p));

  const n = sys.nH;
  const terms = [];
  let prod = 1;
  for (let j = 0; j <= n; j++) {
    if (j > 0) prod *= Ka[j-1];
    terms.push(Math.pow(H, n-j) * prod);
  }
  const D = terms.reduce((a, b) => a + b, 0);
  const f = terms.map(t => t / D);
  let nbar = 0;
  for (let j = 0; j <= n; j++) nbar += (n - j) * f[j];
  return { f, nbar, pKaApp, pKa };
}

/**
 * Recipe for a two-reagent buffer. Iterates ionic strength to self-consistency
 * because pKa' depends on I, which depends on the speciation it produces.
 */
function buffer({ system, pH, Ctotal, Vfinal, acidKey, baseKey, T = 25,
                  addNaCl = 0, addKCl = 0, davies = true }) {
  const sys = BUFFERS[system];
  if (!sys) throw new Error("未知缓冲体系 " + system);
  if (!(Ctotal > 0)) throw new Error("总浓度必须大于 0");
  if (!(Vfinal > 0)) throw new Error("终体积必须大于 0");
  if (!isFinite(pH)) throw new Error("请填写目标 pH");

  const acid = sys.reagents.find(r => r.key === (acidKey || sys.defaultAcid));
  const base = sys.reagents.find(r => r.key === (baseKey || sys.defaultBase));
  if (!acid || !base) throw new Error("请选择两种试剂");
  const pA = sys.nH - acid.j, pB = sys.nH - base.j;   // protons each supplies
  if (pA === pB) throw new Error("两种试剂必须处在不同质子化状态");

  let I = davies ? 0.05 : 0, sp = null, x = 0, y = 0;
  for (let iter = 0; iter < 60; iter++) {
    sp = speciate(sys, pH, davies ? I : 0, T);
    x = Ctotal * (sp.nbar - pB) / (pA - pB);          // mol/L of the acid form
    y = Ctotal - x;
    let Inew = 0;
    for (let j = 0; j <= sys.nH; j++) {
      const z = sys.zmax - j;
      Inew += Ctotal * sp.f[j] * z * z;
    }
    const zA = sys.zmax - acid.j, zB = sys.zmax - base.j;
    Inew += Math.max(x, 0) * Math.abs(zA) + Math.max(y, 0) * Math.abs(zB);
    Inew = Inew / 2 + addNaCl + addKCl;
    if (Math.abs(Inew - I) < 1e-9) { I = Inew; break; }
    I = Inew;
  }

  // Which deprotonation steps does this reagent pair actually bracket? Those
  // pKa' values set the usable window; outside pKa'±1 it is not a buffer.
  const span = usableSpan(sys, acid, base, sp.pKaApp);
  const warnings = [];
  if (pH < span.lo - 2 || pH > span.hi + 2 || x < -1e-12 || y < -1e-12) {
    throw new Error(
      `${acid.label} / ${base.label} 配不出 pH ${sig(pH,3)}。这对试剂的有效范围约 ` +
      `pH ${sig(span.lo - 2, 3)}–${sig(span.hi + 2, 3)}（pKa' ${span.list.map(v => sig(v,3)).join(" / ")}）。` +
      `请换一对试剂或换缓冲体系。`);
  }
  if (pH < span.lo - 1 || pH > span.hi + 1)
    warnings.push(`目标 pH 已接近该体系可用边界（pKa' ${span.list.map(v => sig(v,3)).join(" / ")}），` +
                  `缓冲容量弱，少量酸碱污染就会让 pH 明显漂移。`);
  if (davies && I > 0.2)
    warnings.push(`离子强度算出来是 ${sig(I,3)} M，已超出 Davies 式标称的可靠区间（≲0.1 M，勉强可用到 ~0.5 M）。` +
                  `校正方向仍然对，但数值误差会大于 ±0.1 pH。`);

  const mkMass = (r, c) => {
    const M = molarMass(r.formula).mass;
    const mass = M * c * Vfinal;
    const item = { reagent: r, M, conc: c, mass, moles: c * Vfinal };
    // liquid reagents (glacial acetic acid, ammonia) get pipetted, not weighed
    if (r.liquid) item.volume = mass / (r.liquid.rho * r.liquid.w) / 1000;   // L
    return item;
  };
  const items = [mkMass(acid, x), mkMass(base, y)];
  if (addNaCl > 0) items.push({ reagent:{ label:"NaCl", formula:"NaCl", extra:true },
                                M: molarMass("NaCl").mass, conc: addNaCl,
                                mass: molarMass("NaCl").mass*addNaCl*Vfinal, moles: addNaCl*Vfinal });
  if (addKCl > 0) items.push({ reagent:{ label:"KCl", formula:"KCl", extra:true },
                               M: molarMass("KCl").mass, conc: addKCl,
                               mass: molarMass("KCl").mass*addKCl*Vfinal, moles: addKCl*Vfinal });

  // the step this buffer actually rides on — the one whose pKa' is nearest pH
  const ideal = speciate(sys, pH, 0, T);
  const jLo = Math.min(acid.j, base.j), jHi = Math.max(acid.j, base.j);
  let kNear = jLo;
  for (let k = jLo; k < jHi; k++)
    if (Math.abs(sp.pKaApp[k] - pH) < Math.abs(sp.pKaApp[kNear] - pH)) kNear = k;
  kNear = Math.min(kNear, sp.pKaApp.length - 1);

  return {
    items, I, ratio: y > 0 ? x/y : Infinity, nbar: sp.nbar,
    pKaApp: sp.pKaApp, pKaIdeal: ideal.pKaApp, pKaThermo: sys.pKa,
    shift: sp.pKaApp[kNear] - ideal.pKaApp[kNear],
    nearestIndex: kNear, span, acid, base, warnings, sys, T, davies,
    fractions: sp.f, Ctotal, Vfinal, pH
  };
}

/**
 * The deprotonation steps a reagent pair brackets, and their apparent pKa.
 * Acid form supplies pA protons, base form pB; the steps between them are the
 * ones this pair can actually titrate, so their pKa' values bound the window.
 */
function usableSpan(sys, acid, base, pKaApp) {
  const jLo = Math.min(acid.j, base.j), jHi = Math.max(acid.j, base.j);
  const list = [];
  for (let k = jLo; k < jHi; k++) list.push(pKaApp[k]);
  if (!list.length) list.push(pKaApp[Math.min(jLo, pKaApp.length - 1)]);
  return { lo: Math.min.apply(null, list), hi: Math.max.apply(null, list), list };
}

/** Predict the pH a given molar ratio will actually give (the PBS back-test). */
function predictPH(system, { cAcid, cBase, acidKey, baseKey, T = 25,
                             addNaCl = 0, addKCl = 0, davies = true }) {
  const sys = BUFFERS[system];
  const acid = sys.reagents.find(r => r.key === acidKey);
  const base = sys.reagents.find(r => r.key === baseKey);
  const Ctotal = cAcid + cBase;
  const pA = sys.nH - acid.j, pB = sys.nH - base.j;
  const targetNbar = (cAcid*pA + cBase*pB)/Ctotal;

  let I = davies ? 0.05 : 0, pH = 7;
  for (let iter = 0; iter < 80; iter++) {
    let lo = 0, hi = 14;
    for (let i = 0; i < 80; i++) {
      const mid = (lo + hi)/2;
      if (speciate(sys, mid, davies ? I : 0, T).nbar > targetNbar) lo = mid; else hi = mid;
    }
    pH = (lo + hi)/2;
    const sp = speciate(sys, pH, davies ? I : 0, T);
    let Inew = 0;
    for (let j = 0; j <= sys.nH; j++) { const z = sys.zmax - j; Inew += Ctotal*sp.f[j]*z*z; }
    Inew += cAcid*Math.abs(sys.zmax - acid.j) + cBase*Math.abs(sys.zmax - base.j);
    Inew = Inew/2 + addNaCl + addKCl;
    if (Math.abs(Inew - I) < 1e-10) { I = Inew; break; }
    I = Inew;
  }
  return { pH, I };
}

/* ---------- 7. electrochemistry ------------------------------------------ */
const F_CONST = 96485.332;                // C/mol
const RS_CONST = 2.69e5;                  // Randles-Ševčík, 25 °C

/** Disc / rectangle / ring geometric area, in cm². */
function electrodeArea(shape, dims) {
  switch (shape) {
    case "disc": {
      const d = dims.d;                   // cm
      if (!(d > 0)) throw new Error("直径必须大于 0");
      return { value: Math.PI*d*d/4, expr: "A = πd²/4" };
    }
    case "rect": {
      const { w, h } = dims;
      if (!(w > 0) || !(h > 0)) throw new Error("长宽必须大于 0");
      return { value: w*h, expr: "A = w · h" };
    }
    case "ring": {
      const { dOut, dIn } = dims;
      if (!(dOut > 0) || !(dIn >= 0)) throw new Error("直径必须大于 0");
      if (dIn >= dOut) throw new Error("内径必须小于外径");
      return { value: Math.PI*(dOut*dOut - dIn*dIn)/4, expr: "A = π(dₒ² − dᵢ²)/4" };
    }
    default: throw new Error("未知电极形状");
  }
}

/**
 * Randles-Ševčík, reversible, 25 °C:
 *   i_p = 2.69×10⁵ · n^1.5 · A · D^0.5 · C · v^0.5
 * C MUST be mol/cm³ here, not mol/L — the factor-1000 trap. Callers pass C in
 * mol/L (the app's base unit) and this converts internally.
 */
function randlesSevcik(p, unknown) {
  const n = p.n, A = p.A, D = p.D, v = p.v;
  const C = p.C !== undefined && p.C !== null ? p.C/1000 : null;  // mol/L → mol/cm³
  const ip = p.ip;
  const K = RS_CONST;
  switch (unknown) {
    case "ip": need({n,A,D,C,v},["n","A","D","C","v"]);
      return { value: K*Math.pow(n,1.5)*A*Math.sqrt(D)*C*Math.sqrt(v), dim:"current",
               expr: "iₚ = 2.69×10⁵ · n³ᐟ² · A · D¹ᐟ² · C · v¹ᐟ²" };
    case "D": need({n,A,C,v,ip},["n","A","C","v","ip"]);
      { const r = ip/(K*Math.pow(n,1.5)*A*C*Math.sqrt(v));
        return { value: r*r, dim:"diff", expr: "D = [ iₚ / (2.69×10⁵ n³ᐟ² A C v¹ᐟ²) ]²" }; }
    case "A": need({n,D,C,v,ip},["n","D","C","v","ip"]);
      return { value: ip/(K*Math.pow(n,1.5)*Math.sqrt(D)*C*Math.sqrt(v)), dim:"area",
               expr: "A = iₚ / (2.69×10⁵ n³ᐟ² D¹ᐟ² C v¹ᐟ²)" };
    case "C": need({n,A,D,v,ip},["n","A","D","v","ip"]);
      return { value: 1000*ip/(K*Math.pow(n,1.5)*A*Math.sqrt(D)*Math.sqrt(v)), dim:"conc",
               expr: "C = iₚ / (2.69×10⁵ n³ᐟ² A D¹ᐟ² v¹ᐟ²)" };
    default: throw new Error("未知求解目标 " + unknown);
  }
}

/** Cottrell: i(t) = nFAD^½C / (π^½ t^½), C in mol/L → mol/cm³ internally. */
function cottrell({ n, A, D, C, t }) {
  need({ n, A, D, C, t }, ["n","A","D","C","t"]); nonZero({ t }, ["t"]);
  const Ccm = C/1000;
  return { value: n*F_CONST*A*Math.sqrt(D)*Ccm/(Math.sqrt(Math.PI)*Math.sqrt(t)),
           dim: "current", expr: "i(t) = nFAD¹ᐟ²C / (π¹ᐟ² t¹ᐟ²)" };
}

/** Surface coverage Γ = Q / (nFA), mol/cm². */
function coverage({ Q, n, A }) {
  need({ Q, n, A }, ["Q","n","A"]); nonZero({ n, A }, ["n","A"]);
  return { value: Q/(n*F_CONST*A), dim: "surfconc", expr: "Γ = Q / (nFA)" };
}

/** Faraday: n = Q / (zF). */
function chargeToMoles({ Q, z }) {
  need({ Q, z }, ["Q","z"]); nonZero({ z }, ["z"]);
  return { value: Q/(z*F_CONST), dim: "amount", expr: "n = Q / (zF)" };
}

/** Current density j = i / A. */
function currentDensity({ i, A }) {
  need({ i, A }, ["i","A"]); nonZero({ A }, ["A"]);
  return { value: i/A, expr: "j = i / A" };     // A/cm², formatted by caller
}

/** LOD = kσ/S. S in A per (mol/L); σ in A. Returns mol/L. */
function detectionLimit({ S, sigma, k = 3 }) {
  need({ S, sigma }, ["S","sigma"]); nonZero({ S }, ["S"]);
  return { value: k*sigma/S, dim: "conc", expr: `LOD = ${k}σ / S` };
}

/* ---------- 10. plain-text record formatting -----------------------------
   Records are what the user exports to their lab notebook. Alignment has to
   account for CJK glyphs being two columns wide in a monospace font,
   otherwise the columns shear apart in Notepad.                            */
const WIDE = /[ᄀ-ᅟ⺀-〾ぁ-㏿㐀-䶿一-鿿ꀀ-꓏가-힣豈-﫿︰-﹯＀-｠￠-￦]/;
function dispWidth(s) {
  let w = 0;
  for (const ch of String(s == null ? "" : s)) w += WIDE.test(ch) ? 2 : 1;
  return w;
}
function padTo(s, n) {
  s = String(s == null ? "" : s);
  const gap = n - dispWidth(s);
  return gap > 0 ? s + " ".repeat(gap) : s;
}
function rule(ch, n) { return ch.repeat(Math.max(0, n)); }

function stamp(ms) {
  const d = new Date(ms);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes());
}

/* Characters that must never begin a line (CJK 行首禁则). Breaking before a
   closing bracket or a full stop is what makes wrapped Chinese look broken. */
const NO_LINE_START = "。，、；：？！…·）】》」』〉｝”’%,.;:?!)]}>";
/** Wrap a long string at `cols` display columns, respecting 行首禁则. */
function wrapCols(t, cols) {
  const out = [];
  let cur = "";
  for (const ch of String(t)) {
    const over = cur && dispWidth(cur + ch) > cols;
    // let a forbidden-at-start char overhang rather than orphan it on the next line
    if (over && NO_LINE_START.indexOf(ch) < 0) { out.push(cur); cur = ""; }
    cur += ch;
  }
  if (cur) out.push(cur);
  // continuation lines never keep the space the break landed on
  return (out.length ? out : [""]).map((seg, i) => i ? seg.replace(/^ +/, "") : seg);
}

/* Why there is no column padding below.
   Aligning mixed CJK/Latin text with spaces requires the CJK advance width to
   be an exact integer multiple of the space width. Measured in this app's own
   font stack it is 1.667x (IBM Plex Mono advances 0.6em, the CJK fallback
   1.0em); Notepad's Consolas + YaHei pairing gives 1.818x. Neither is an
   integer, so no amount of padding can line the columns up -- and Word's
   proportional default makes it hopeless regardless. Delimiters survive every
   font, and "|" additionally lets the table paste into Excel via
   Data > Text to Columns.                                                   */
const CELL = "  |  ";

/** One record as plain text. `n` is its 1-based position in the export. */
function formatRecord(rec, n) {
  const L = [];
  L.push("[" + n + "] " + rec.module + "    " + stamp(rec.t));

  if (rec.inputs && rec.inputs.length) {
    L.push("");
    L.push("  输入");
    rec.inputs.forEach(r => L.push("    " + r[0] + "：" + r[1]));
  }
  if (rec.formula) {
    L.push("");
    L.push("  计算");
    L.push("    " + rec.formula);
    if (rec.formulaSubs) L.push("    " + rec.formulaSubs);
    if (rec.result) L.push("    = " + rec.result);
  } else if (rec.result) {
    L.push("");
    L.push("  结果：" + rec.result);
  }
  if (rec.table && rec.table.head && rec.table.rows && rec.table.rows.length) {
    L.push("");
    L.push("  " + (rec.tableTitle || "表格"));
    const cell = v => String(v == null ? "" : v).trim();
    L.push("    " + rec.table.head.map(cell).join(CELL));
    L.push("    " + rule("-", 46));
    rec.table.rows.forEach(r => L.push("    " + r.map(cell).join(CELL)));
  }
  if (rec.say) {
    L.push("");
    L.push("  说明");
    wrapCols(rec.say, 56).forEach(seg => L.push("    " + seg));
  }
  if (rec.notes && rec.notes.length) {
    L.push("");
    L.push("  提示");
    rec.notes.forEach(t => wrapCols(t, 56).forEach((seg, i) =>
      L.push("    " + (i === 0 ? "- " : "  ") + seg)));
  }
  return L.join("\n");
}

/** The whole export document. */
function formatRecords(recs, nowMs) {
  const now = nowMs == null ? Date.now() : nowMs;
  const head = [
    rule("=", 58),
    "  配液台 · 实验记录",
    "  导出于 " + stamp(now) + "    共 " + recs.length + " 条",
    rule("=", 58),
    ""
  ];
  if (!recs.length) return head.concat(["  （还没有记录）", ""]).join("\n");
  const foot = [
    "",
    rule("-", 58),
    "表格用 | 分隔：不同字体下中英文宽度比不是整数，空格对齐必然错位；",
    "分隔符在任何字体下都成立，也能用 Excel 的「分列」按 | 拆开。",
    "",
    "摩尔质量按 IUPAC 2021 标准原子量。",
    "缓冲液配比为理论值（已含 Davies 活度校正），残余误差 ±0.1-0.2 pH，",
    "配好必须用 pH 计实测、用 HCl / NaOH 微调。浓酸稀释一律酸入水。",
    "由 配液台 生成  https://peiyetai.netlify.app"
  ];
  return head.concat([recs.map((r, i) => formatRecord(r, i + 1)).join("\n\n")])
             .concat(foot).join("\n");
}


/* ---------- 11. natural-language request parser --------------------------- */
/* ============================================================================
   Natural-language request parser.

   Deliberately rule-based, not an LLM: this runs offline on a static page, the
   numbers it produces go onto a bench, and a wrong answer that *looks*
   confident is worse than "没看懂". So it extracts what it can recognise,
   echoes that back for the user to check, and names what is missing instead of
   guessing.
   ========================================================================== */

/* ---------- normalisation ------------------------------------------------ */
/** Full-width → half-width, unify the several micro/mu signs, strip noise. */
function normalizeQuery(s) {
  return String(s == null ? "" : s)
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, " ")
    .replace(/[μμµ]/g, "µ")
    .replace(/[，、]/g, ",")
    .replace(/[：]/g, ":")
    .replace(/[（）]/g, m => m === "（" ? "(" : ")")
    .replace(/[–—~～]/g, "-")
    .replace(/\s+/g, " ")
    .trim();
}

/* ---------- quantity extraction ------------------------------------------
   Ordered longest-first so "mg/mL" wins over "mg", and "mM" over "M".
   Molarity requires a capital M: lower-case "mm"/"nm" are far more likely to
   be millimetre/nanometre than millimolar, and silently reading a length as a
   concentration is exactly the kind of confident-but-wrong answer to avoid. */
const UNIT_PATTERNS = [
  // mass concentration
  ["µg/mL", "massconc", /^(?:µg|ug)\s*\/\s*(?:ml|mL)/],
  ["mg/mL", "massconc", /^mg\s*\/\s*(?:ml|mL)/],
  ["mg/L",  "massconc", /^mg\s*\/\s*[lL]/],
  ["g/L",   "massconc", /^g\s*\/\s*[lL]/],
  ["ppm",   "massconc", /^ppm/i],
  // molar mass
  ["g/mol", "molar",    /^(?:g\s*\/\s*mol|Da|dalton)/i],
  ["kg/mol","molar",    /^(?:kDa|kg\s*\/\s*mol)/i],
  // molar concentration — capital M only
  ["nM",    "conc",     /^nM\b/],
  ["µM",    "conc",     /^(?:µM|uM)\b/],
  ["mM",    "conc",     /^mM\b/],
  ["M",     "conc",     /^(?:M\b|mol\s*\/\s*[lL]|摩尔每升|摩尔\/升)/],
  // volume
  ["µL",    "volume",   /^(?:µl|ul|µL|uL|微升)/],
  ["mL",    "volume",   /^(?:ml|mL|毫升)/],
  ["L",     "volume",   /^(?:[lL]\b|升)/],
  // mass
  ["ng",    "mass",     /^ng\b/],
  ["µg",    "mass",     /^(?:µg|ug|微克)/],
  ["mg",    "mass",     /^(?:mg|毫克)/],
  ["kg",    "mass",     /^(?:kg|千克|公斤)/],
  ["g",     "mass",     /^(?:g\b|克)/]
];

/** Every number in the text, tagged with the unit that follows it. */
function extractQuantities(text) {
  const out = [];
  // never treat a leading "-" as a sign: volumes/concentrations/masses are all
  // positive, so a dash is always a range separator ("50,000-190,000 Da")
  const re = /(\d+(?:[,，]\d{3})*(?:\.\d+)?(?:[eE][-+]?\d+)?)\s*/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const value = parseFloat(m[1].replace(/[,，]/g, ""));
    if (!isFinite(value)) continue;
    const rest = text.slice(re.lastIndex);
    // percent first: "%" never collides with anything else
    const pm = /^%\s*\(?\s*(w\s*\/\s*v|v\s*\/\s*v|w\s*\/\s*w)?\s*\)?/i.exec(rest);
    if (pm) {
      out.push({ value, dim: "percent", unit: "%", at: m.index,
                 basis: pm[1] ? pm[1].replace(/\s/g, "").toLowerCase() : null,
                 len: pm[0].length });
      continue;
    }
    let hit = null;
    for (const [unit, dim, pat] of UNIT_PATTERNS) {
      const um = pat.exec(rest);
      if (um) { hit = { unit, dim, len: um[0].length }; break; }
    }
    if (hit) out.push({ value, dim: hit.dim, unit: hit.unit, at: m.index, len: hit.len });
    else out.push({ value, dim: null, unit: null, at: m.index, len: 0 });
  }
  return out;
}

/** A "50,000-190,000 Da" style range means the molar mass is not a number. */
function findMolarMassRange(text) {
  const re = /(\d[\d,]*(?:\.\d+)?)\s*-\s*(\d[\d,]*(?:\.\d+)?)\s*(kDa|Da|g\s*\/\s*mol)/i;
  const m = re.exec(text);
  if (!m) return null;
  const f = s => parseFloat(s.replace(/,/g, ""));
  const k = /kDa/i.test(m[3]) ? 1000 : 1;
  return { lo: f(m[1]) * k, hi: f(m[2]) * k, raw: m[0] };
}

/* ---------- reagent matching --------------------------------------------- */
/** Longest-first so "醋酸钠" beats "醋酸" and "乙酸" maps to acetic acid. */
const NAME_ALIASES = [
  ["乙酸", "冰醋酸"], ["醋酸", "冰醋酸"], ["acetic", "冰醋酸"],
  ["盐酸", "浓盐酸"], ["硫酸", "浓硫酸"], ["硝酸", "浓硝酸"],
  ["氢氧化钠", "氢氧化钠"], ["烧碱", "氢氧化钠"],
  ["食盐", "氯化钠"], ["氯化钾", "氯化钾"],
  ["葡萄糖", "D-葡萄糖 (无水)"], ["glucose", "D-葡萄糖 (无水)"],
  ["铁氰化钾", "铁氰化钾 (赤血盐)"], ["赤血盐", "铁氰化钾 (赤血盐)"],
  ["亚铁氰化钾", "亚铁氰化钾 三水"], ["黄血盐", "亚铁氰化钾 三水"],
  ["壳聚糖", "壳聚糖"], ["chitosan", "壳聚糖"],
  ["乳酸钠", "L-乳酸钠"], ["丙酮酸钠", "丙酮酸钠"],
  ["抗坏血酸", "抗坏血酸 (VC)"], ["维生素c", "抗坏血酸 (VC)"],
  ["多巴胺", "多巴胺 盐酸盐"], ["尿酸", "尿酸"], ["尿素", "尿素"],
  ["双氧水", "过氧化氢 30%"], ["过氧化氢", "过氧化氢 30%"],
  ["戊二醛", "戊二醛 25%"], ["nafion", "Nafion 5% 分散液"],
  ["bsa", "牛血清白蛋白"], ["牛血清白蛋白", "牛血清白蛋白"]
];

function matchReagents(text, REAGENTS) {
  const low = text.toLowerCase();
  const found = [];
  const push = (r, at, via) => {
    if (r && !found.some(f => f.r.n === r.n)) found.push({ r, at, via });
  };
  // explicit library names / english / formulas, longest first
  const cands = [];
  REAGENTS.forEach(r => {
    [r.n, r.en, r.f].forEach(k => { if (k) cands.push([k, r]); });
  });
  cands.sort((a, b) => b[0].length - a[0].length);
  for (const [key, r] of cands) {
    const i = low.indexOf(key.toLowerCase());
    if (i >= 0) push(r, i, key);
  }
  // colloquial aliases
  for (const [alias, canonical] of NAME_ALIASES) {
    const i = low.indexOf(alias.toLowerCase());
    if (i < 0) continue;
    const r = REAGENTS.find(x => x.n === canonical);
    if (r) push(r, i, alias);
  }
  found.sort((a, b) => a.at - b.at);
  return found;
}

/* ---------- intent ------------------------------------------------------- */
const BUFFER_HINTS = [
  [/pbs|磷酸盐|磷酸缓冲/i, "phosphate_na"], [/tris/i, "tris"],
  [/hepes/i, "hepes"], [/\bmes\b/i, "mes"],
  [/醋酸盐缓冲|乙酸盐缓冲|acetate buffer/i, "acetate"],
  [/柠檬酸盐|citrate/i, "citrate"], [/碳酸盐|carbonate/i, "carbonate"]
];

function detectIntent(text, q) {
  const has = d => q.some(x => x.dim === d);
  const pH = /\bpH\s*=?\s*(\d+(?:\.\d+)?)/i.exec(text);
  const bufferSys = BUFFER_HINTS.find(([re]) => re.test(text));
  if (pH && (bufferSys || /缓冲/i.test(text)))
    return { intent: "buffer", pH: parseFloat(pH[1]),
             system: bufferSys ? bufferSys[1] : "phosphate_na" };
  if (/稀释|母液|stock|原液|取多少|吸取/i.test(text) && has("conc"))
    return { intent: "dilute" };
  if (has("percent")) return { intent: "percent" };
  if (has("conc")) return { intent: "molar" };
  if (has("massconc")) return { intent: "massconc" };
  return { intent: null };
}

/* ---------- the interpreter ---------------------------------------------- */
/**
 * Turn a sentence into a plan. Always returns an object; `ok:false` carries
 * `missing` so the UI can say exactly what to add rather than failing silently.
 */
function interpret(rawText, deps) {
  const REAGENTS = deps.REAGENTS, BUFFERS = deps.BUFFERS;
  const text = normalizeQuery(rawText);
  if (!text) return { ok: false, missing: ["请先描述你要配什么"], echo: {}, text };

  const q = extractQuantities(text);
  const reagents = matchReagents(text, REAGENTS);
  const mwRange = findMolarMassRange(text);
  const det = detectIntent(text, q);
  const pick = d => q.filter(x => x.dim === d);
  const vols = pick("volume"), concs = pick("conc"),
        pcts = pick("percent"), masses = pick("mass"),
        mcs = pick("massconc"), mws = pick("molar");

  const echo = {
    体积: vols.map(v => v.value + " " + v.unit),
    浓度: concs.map(v => v.value + " " + v.unit),
    百分比: pcts.map(v => v.value + "%" + (v.basis ? " (" + v.basis + ")" : "")),
    质量浓度: mcs.map(v => v.value + " " + v.unit),
    摩尔质量: mws.map(v => v.value + " " + v.unit),
    识别到的试剂: reagents.map(f => f.r.n),
    分子量范围: mwRange ? mwRange.raw : null,
    pH: det.intent === "buffer" ? String(det.pH) : null,
    缓冲体系: det.intent === "buffer" ? BUFFERS[det.system].name : null
  };

  const base = { echo, text, intent: det.intent };
  const missing = [];
  if (!det.intent) {
    return Object.assign(base, { ok: false, missing: [
      "没认出要做哪种计算。试试写成：「配 20 mL 1% 壳聚糖」、" +
      "「配 50 mL 10 mM NaCl」、「从 1 M 母液配 50 mL 10 mM」、" +
      "「配 500 mL 0.1 M PBS pH 7.4」。"] });
  }

  const totalV = vols.length ? vols[0] : null;
  const Vbase = totalV ? totalV.value * unitFactor(totalV.unit, "volume", deps) : NaN;

  /* ---- buffer ---- */
  if (det.intent === "buffer") {
    if (!totalV) missing.push("配制体积（例如 500 mL）");
    const Ct = concs.length ? concs[0] : null;
    if (!Ct) missing.push("缓冲总浓度（例如 0.1 M 或 100 mM）");
    if (missing.length) return Object.assign(base, { ok: false, missing });
    return Object.assign(base, { ok: true, route: "buffer",
      params: { system: det.system, pH: det.pH,
                Ctotal: Ct.value * unitFactor(Ct.unit, "conc", deps),
                Vfinal: Vbase },
      summary: `配 ${totalV.value} ${totalV.unit} 的 ${Ct.value} ${Ct.unit} ` +
               `${BUFFERS[det.system].name} 缓冲液，pH ${det.pH}` });
  }

  /* ---- dilution ---- */
  if (det.intent === "dilute") {
    if (concs.length < 2) missing.push("母液浓度和目标浓度两个值（例如「从 1 M 配 10 mM」）");
    if (!totalV) missing.push("要配多少体积（例如 50 mL）");
    if (missing.length) return Object.assign(base, { ok: false, missing });
    const vals = concs.map(c => c.value * unitFactor(c.unit, "conc", deps));
    const C1 = Math.max.apply(null, vals), C2 = Math.min.apply(null, vals);
    return Object.assign(base, { ok: true, route: "dilute",
      params: { C1, C2, V2: Vbase },
      summary: `从母液稀释配 ${totalV.value} ${totalV.unit}` });
  }

  /* ---- percent ---- */
  if (det.intent === "percent") {
    if (!totalV) missing.push("配制体积（例如 20 mL）");
    if (!pcts.length) missing.push("百分浓度（例如 1%）");
    if (missing.length) return Object.assign(base, { ok: false, missing });
    // pair each percentage with the nearest reagent mentioned before/after it
    const comps = pcts.map(p => {
      let best = null, bestD = Infinity;
      reagents.forEach(f => {
        const d = Math.abs(f.at - p.at);
        if (d < bestD) { bestD = d; best = f.r; }
      });
      const isLiquid = !!(best && best.rho);
      return {
        reagent: best, percent: p.value,
        basis: p.basis || (isLiquid ? "v/v" : "w/v"),
        basisAssumed: !p.basis
      };
    });
    return Object.assign(base, { ok: true, route: "percent",
      params: { Vfinal: Vbase, components: comps, mwRange },
      summary: `配 ${totalV.value} ${totalV.unit}，` +
               comps.map(c => `${c.percent}% ${c.reagent ? c.reagent.n : "（未识别试剂）"}`).join(" + ") });
  }

  /* ---- mass concentration (mg/mL etc.) ---- */
  if (det.intent === "massconc") {
    if (!totalV) missing.push("配制体积");
    if (missing.length) return Object.assign(base, { ok: false, missing });
    const c = mcs[0];
    return Object.assign(base, { ok: true, route: "massconc",
      params: { Vfinal: Vbase, c: c.value * unitFactor(c.unit, "massconc", deps),
                reagent: reagents.length ? reagents[0].r : null },
      summary: `配 ${totalV.value} ${totalV.unit} 的 ${c.value} ${c.unit}` });
  }

  /* ---- molar ---- */
  if (!totalV) missing.push("配制体积（例如 50 mL）");
  if (!concs.length) missing.push("目标浓度（例如 10 mM）");
  // A "50,000-190,000 Da" range tokenises as a bare number plus "190,000 Da";
  // taking that upper bound as if it were a definite molar mass is exactly the
  // confidently-wrong answer this parser exists to avoid. Refuse the molar
  // route outright whenever a range is present.
  if (mwRange) {
    return Object.assign(base, { ok: false, missing: [
      `给的是摩尔质量范围（${mwRange.raw}），上下限差 ` +
      `${deps.sig(mwRange.hi / mwRange.lo, 2)} 倍 —— 按摩尔浓度配，称出来的量也会差这么多倍，` +
      `这个数没有意义。聚合物请改用质量百分比（「配 20 mL 1% 壳聚糖」）或 mg/mL。`] });
  }
  let M = mws.length ? mws[0].value * unitFactor(mws[0].unit, "molar", deps) : null;
  let Msource = M ? "你给的摩尔质量" : null;
  const reag = reagents.length ? reagents[0].r : null;
  if (M == null && reag && reag.f) {
    try { M = deps.molarMass(reag.f).mass; Msource = reag.n + " 的化学式 " + reag.f; }
    catch (e) { M = null; }
  }
  if (M == null) missing.push("摩尔质量（例如 M=180.16 g/mol），或用化学式/试剂库里的名字");
  if (missing.length) return Object.assign(base, { ok: false, missing });
  const c = concs[0];
  return Object.assign(base, { ok: true, route: "molar",
    params: { M, Msource, C: c.value * unitFactor(c.unit, "conc", deps),
              V: Vbase, reagent: reag },
    summary: `配 ${totalV.value} ${totalV.unit} 的 ${c.value} ${c.unit}` +
             (reag ? " " + reag.n : "") });
}

function unitFactor(unit, dim, deps) { return deps.factorOf(dim, unit); }

/* ---------- solving ------------------------------------------------------
   Each route returns the same shape so the UI renders one way:
     { title, items:[{what, how, amount, formula, note}], notes, warnings }  */
function solveRequest(plan, deps) {
  if (!plan.ok) return plan;
  const sig = deps.sig, auto = deps.auto;
  const out = { ok: true, route: plan.route, echo: plan.echo,
                summary: plan.summary, items: [], notes: [], warnings: [] };

  if (plan.route === "percent") {
    const V = plan.params.Vfinal;                       // L
    plan.params.components.forEach(c => {
      const name = c.reagent ? c.reagent.n : "（未识别的物质）";
      if (c.basis === "v/v") {
        const vol = c.percent / 100 * V;                // L of neat liquid
        const item = { what: name, how: "量取",
          amount: auto(vol, "volume").text,
          formula: `V = ${c.percent}% × ${auto(V,"volume").text} = ${auto(vol,"volume").text}` };
        if (c.reagent && c.reagent.rho && c.reagent.w < 0.999)
          item.note = `按原瓶液体体积计。瓶子是 ${Math.round(c.reagent.w*1000)/10}% 纯度，` +
                      `若要 ${c.percent}% 的是纯${name}，需 ${auto(vol/c.reagent.w,"volume").text}。`;
        out.items.push(item);
      } else if (c.basis === "w/w") {
        const mass = c.percent / 100 * V * 1000;        // g, assuming ρ≈1 g/mL
        out.items.push({ what: name, how: "称取", amount: auto(mass, "mass").text,
          formula: `m = ${c.percent}% × ${auto(V,"volume").text} × 1 g/mL = ${auto(mass,"mass").text}`,
